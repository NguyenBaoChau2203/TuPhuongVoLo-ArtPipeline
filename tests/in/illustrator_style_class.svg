<?xml version="1.0" encoding="UTF-8"?>
<!-- Synthetic Illustrator-style export: internal <style> with classes, an
     inline-style hidden helper layer, and an unsupported decorative element
     (circle) that must warn, not crash. Hand-written, safe. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="300pt" height="200pt" viewBox="0 0 300 200">
  <defs>
    <style type="text/css">
      .wall { fill: none; stroke: #000000; stroke-width: 1; }
      .guide { display: none; }
    </style>
  </defs>
  <g id="room_bep" data-name="Bếp">
    <path class="wall" d="M0 0 L150 0 L150 100 L0 100 Z"/>
    <circle class="wall" cx="75" cy="50" r="20"/>
  </g>
  <g id="guides" class="guide">
    <path class="wall" d="M0 0 L300 0 L300 200 L0 200 Z"/>
  </g>
  <g id="hidden_helper" style="display:none">
    <path d="M10 10 L20 10 L20 20 L10 20 Z"/>
  </g>
</svg>
