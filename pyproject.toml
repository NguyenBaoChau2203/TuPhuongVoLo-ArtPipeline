[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tuphuongvolo-artpipeline"
version = "0.1.0"
description = "Semi-automated art pipeline for the indie game Tứ Phương Vô Lộ"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary"}

dependencies = [
    # SVG cleanup and validation
    "svgpathtools==1.7.2",
    "vpype[all]==1.15.0",
    "lxml>=4.9,<6.0",
    # Manifest & config
    "pyyaml>=6.0,<7.0",
    # CLI
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
